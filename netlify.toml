# Public build only. Demo builds (DATA_MODE=demo, out-demo/) are never deployed.
[build]
  command = "npm run build && npm run audit:public"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  DATA_MODE = "public"

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets never change.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The service worker must always be revalidated.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Open Graph images are exported without an extension.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
[[headers]]
  for = "/*/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
