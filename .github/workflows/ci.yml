name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Fuel prices freshness (warning only)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-fuel-prices.ts
      - run: npm test
      - run: npm run build
      - run: npm run build:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Lighthouse CI
        run: npx @lhci/cli@0.15.1 autorun
